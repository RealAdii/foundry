name: deployment label validation

on:
  push:
    branches: [ci/deployment-label-lookup]

permissions:
  contents: read

concurrency:
  group: deployment-label-validation
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  fmt-typos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/deployment-label-lookup
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly
          components: rustfmt
      - name: rustfmt (make fmt)
        run: cargo fmt --all --check
      - name: typos (make lint-typos)
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b

  clippy-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/deployment-label-lookup
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: nightly-2026-10-31
          components: clippy
      - name: prepare runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install --yes libudev-dev libssl-dev pkg-config cmake clang
          df -h .
      - name: clippy on changed crates (make lint-clippy, scoped)
        env:
          RUSTFLAGS: -Dwarnings
        run: cargo clippy -p forge-script-sequence -p foundry-cheatcodes -p foundry-cheatcodes-spec -p forge --all-targets --all-features --locked
      - name: rustdoc on changed library crates (make doc, scoped)
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
        run: cargo doc --no-deps -p forge-script-sequence -p foundry-cheatcodes -p foundry-cheatcodes-spec --locked
      - run: df -h .

  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/deployment-label-lookup
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - name: prepare runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install --yes libudev-dev libssl-dev pkg-config cmake clang
      - name: generated cheatcode assets are up to date
        run: |
          cargo cheats || cargo cheats
          cargo cheats
          git diff --exit-code
      - name: script-sequence unit tests
        run: cargo test -p forge-script-sequence --lib --locked
      - name: cheatcodes unit tests
        run: cargo test -p foundry-cheatcodes -p foundry-cheatcodes-spec --locked
      - name: deployment lookup integration tests
        run: cargo test -p forge --test cli --locked -- deployment
      - name: existing getDeployment/getBroadcast integration test
        run: cargo test -p forge --test cli --locked -- can_get_broadcast_txs
